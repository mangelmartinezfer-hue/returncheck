name: Preflight and regression tests
on:
  pull_request:
    paths: ['src/**', 'test/**', 'preflight/**', 'tools/preflight/**', 'package*.json', '*.sql', 'wrangler.toml', '.gitattributes', '.gitignore', '.github/workflows/preflight.yml']
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'preflight/**', 'tools/preflight/**', 'package*.json', '*.sql', 'wrangler.toml', '.gitattributes', '.gitignore', '.github/workflows/preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic preflight
        run: npm run validate
      - name: Full regression suite
        if: ${{ !cancelled() }}
        run: npm test
