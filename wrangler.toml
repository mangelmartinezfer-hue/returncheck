name = "returncheck"
main = "src/index.mjs"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- Variables públicas (NO secretos). Se pueden editar aquí o en el panel. ---
[vars]
PRICE_USD = "0.02"          # precio por consulta con veredicto útil
CHARGE_ON_UNKNOWN = "false" # decisión 22 ago: NO se cobra en UNKNOWN
SIGNUP_FREE_CREDIT_USD = "2.00"  # crédito de prueba al registrarse (~100 consultas)
CACHE_TTL_DAYS = "7"        # frescura del extracto de política cacheado
PUBLIC_BASE_URL = "https://returncheck.m-angelmartinez-fer.workers.dev"
# --- Aviso de datos y fuentes (/data-policy). Publicos, no son secretos. ---
CONTACT_EMAIL = "martiplacsystem@gmail.com"   # direccion de reclamacion/borrado
DATA_RETENTION_MONTHS = "48"                  # decision 25 ago 2026 (doc 40)
# --- W19: registro de respuestas. Retencion MAS CORTA que la del corpus a proposito:
#     el texto de una politica envejece bien como archivo; el registro de quien
#     pregunto que, no. "false" en ANSWER_LOG lo apaga sin desplegar.
ANSWER_RETENTION_MONTHS = "12"
ANSWER_LOG = "true"

# --- W28: x402. APAGADO hasta que haya direccion de cobro y el flujo este probado
#     en la red de pruebas. Mientras X402_ENABLED sea "false" no cambia nada.
#     La direccion de cobro NO es un secreto: es publica por definicion, ahi es
#     donde se ve el dinero entrar. Pero no hay ninguna clave privada en este
#     proyecto: nosotros solo COBRAMOS, no firmamos ni movemos fondos.
X402_ENABLED = "true"
X402_NETWORK = "eip155:8453"                  # Base MAINNET. Dinero real desde el 28 ago 2026.
# La direccion de recepcion. Es PUBLICA por definicion: viaja en el reto de pago y
# cualquiera puede ver su saldo y su historial en Basescan. Por eso es una cuenta
# aparte, solo de ReturnCheck, y no la personal de Miguel.
# Checksum EIP-55 verificado el 28 ago 2026. Una letra cambiada da una direccion
# valida en apariencia y el dinero no vuelve.
# VA AQUI Y NO SOLO EN EL PANEL: las variables de wrangler.toml pisan las del panel
# en cada despliegue. Si viviera solo en el panel, el proximo deploy la vaciaria y
# el servicio dejaria de anunciar precio sin que nadie se entere.
X402_PAY_TO = "0xbF428071027402E9b0cE85e22146EDdc028cEB3b"
X402_ASSET = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"   # USDC oficial en Base mainnet
# PROCEDENCIA DE ESTA DIRECCION, porque no se pone de memoria: documentacion
# oficial de Circle (developers.circle.com/stablecoins/usdc-contract-addresses),
# leida el 28 ago 2026. En esa misma pagina figura la de Base Sepolia, que
# coincidia caracter a caracter con la que teniamos: eso valida la fuente ademas
# del dato. Confirmado luego contra la propia cadena (chainId 8453): symbol USDC,
# 6 decimales.
#
# EL VALOR QUE CASI SE NOS COLA. El nombre va al dominio EIP-712 con el que firma
# el comprador; si no coincide con el del token, la firma no valida y NINGUN pago
# entra. Y no es el mismo en las dos redes:
#     Base Sepolia  ->  name() = "USDC"
#     Base mainnet  ->  name() = "USD Coin"
# Leido de los dos contratos el 28 ago 2026. Con "USDC" aqui, mainnet no cobraria
# nada y no habria ningun error que lo explicase: falla cerrado, en silencio.
X402_ASSET_NAME = "USD Coin"
# La version del dominio EIP-712, leida del contrato: "2" en las dos redes.
X402_ASSET_VERSION = "2"
X402_TIMEOUT_SECONDS = "60"
# El FACILITADOR es quien nos dice si un pago es real. Eleccion pendiente para
# mainnet: es una decision de CONFIANZA, no tecnica — un facilitador que mintiera
# diciendo "pagado" nos haria regalar respuestas. Para la red de pruebas da igual,
# el dinero es de mentira. Sin esto configurado, x402 no cobra ni sirve: falla
# cerrado a proposito.
# Mogami v2. Vuelto a comprobar contra su propio /supported el 28 ago 2026, ya con
# mainnet encendido: declara x402Version 2, esquema "exact", y eip155:8453.
# Sin cuenta, sin clave, sin comision — segun ellos. Esa gratuidad es politica
# suya y puede cambiar; es un riesgo de negocio, no un fallo tecnico.
#
# Se eligio frente al de x402.org por un motivo concreto: Mogami declara la version
# en la URL (v2. frente a v1.). Nosotros somos estrictamente v2 y esa ambiguedad es
# la clase de detalle que quema una tarde.
#
# PARA MAINNET SIGUE SIENDO UNA DECISION DE CONFIANZA, no tecnica: un facilitador
# que mintiera diciendo "pagado" nos haria regalar respuestas. Que valga tecnicamente
# no significa que este decidido.
X402_FACILITATOR = "https://v2.facilitator.mogami.tech"
X402_TIMEOUT_MS = "8000"
# W41 — liquidar espera confirmaciones de una cadena; verificar es solo una
# consulta. Darles el mismo plazo nos costo un cobro sin entrega el 27 de agosto:
# la liquidacion tardo 11 s, el plazo de 8 vencio, y el dinero llego igualmente.
X402_SETTLE_TIMEOUT_MS = "25000"
# Cuanto tiempo se recuerda un identificador de pago para no cobrar dos veces por
# el mismo reintento. Mas largo que cualquier ventana de reintento razonable, y no
# eterno.
IDEMPOTENCY_HOURS = "24"
# --- W05: muestreo del modelo. Editable en el panel SIN desplegar, para poder
#     medir las dos ramas del experimento contra el MISMO build. "0.6" era el
#     comportamiento anterior: el que Workers AI aplicaba solo, sin decidirlo nadie.
AI_TEMPERATURE = "0"
# --- W05: frases candidatas. "false" vuelve al comportamiento anterior (cita
#     libre) SIN desplegar, para medir las dos ramas contra el mismo build.
USE_CANDIDATES = "true"
# AI_SEED = "1234"                            # opcional; sin ella no se envia semilla
# --- Tramo de prueba SIN clave (para que agentes autónomos prueben check_return) ---
FREE_TRIAL_ENABLED = "true"     # pon "false" para cerrar el tramo gratis
FREE_IP_DAILY = "3"             # consultas gratis por IP y día
FREE_GLOBAL_DAILY = "500"       # tope global diario (red de seguridad del gasto)

# --- CLAVES PRIVADAS: NO van aquí (el repo puede ser público). ---
# DEMO_KEY (ruta /demo) y ADMIN_KEY (/dashboard y /stats) se ponen como SECRETOS
# cifrados en el panel de Cloudflare (Settings -> Variables and Secrets), NUNCA en
# este archivo. El código las lee como env.DEMO_KEY y env.ADMIN_KEY.

# --- Base de datos D1 (se crea en el panel; pega aquí el database_id que te dé) ---
[[d1_databases]]
binding = "DB"
database_name = "returncheck"
database_id = "0f67ff3e-850d-41d4-b2b0-88209fb4b651"

# --- Modelo de IA (Workers AI) ---
[ai]
binding = "AI"

# --- Navegador headless para leer las páginas de política ---
[browser]
binding = "BROWSER"

# SECRETOS (NUNCA aquí): se ponen en el panel de Cloudflare o con
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
# Los lee el código como env.STRIPE_SECRET_KEY / env.STRIPE_WEBHOOK_SECRET
